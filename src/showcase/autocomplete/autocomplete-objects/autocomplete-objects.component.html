<mat-form-field appearance="outline" class="docs-field">
  <mat-label>Assignee</mat-label>
  <input matInput [formControl]="control" [matAutocomplete]="auto" />
  <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayUser">
    @for (user of filtered(); track user.id) {
      <mat-option [value]="user">
        {{ user.name }} <small>{{ user.email }}</small>
      </mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
<p>Control value: {{ control.value === null ? 'null' : displayUser(control.value) }}</p>
