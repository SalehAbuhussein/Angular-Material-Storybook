<div class="docs-surface shell">
  <mat-sidenav-container class="container">
    <mat-sidenav
      #drawer
      [mode]="isHandset() ? 'over' : 'side'"
      [opened]="!isHandset()"
      class="drawer"
    >
      <mat-nav-list>
        <a mat-list-item href="#">Overview</a>
        <a mat-list-item href="#">Reports</a>
        <a mat-list-item href="#">Settings</a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <mat-toolbar>
        @if (isHandset()) {
          <button matIconButton aria-label="Toggle navigation" (click)="drawer.toggle()">
            <mat-icon>menu</mat-icon>
          </button>
        }
        <span>Dashboard</span>
      </mat-toolbar>
      <div class="content">
        <p>The drawer is <strong>{{ isHandset() ? 'over' : 'side' }}</strong> mode.</p>
        <p class="hint">Narrow the canvas below 600px to switch it.</p>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
