<mat-form-field appearance="outline" class="docs-field">
  <mat-label>Tags</mat-label>
  <mat-chip-grid #grid aria-label="Tag entry">
    @for (tag of tags(); track tag) {
      <mat-chip-row (removed)="remove(tag)" [aria-description]="'Press delete to remove ' + tag">
        {{ tag }}
        <button matChipRemove [attr.aria-label]="'Remove ' + tag">
          <mat-icon>cancel</mat-icon>
        </button>
      </mat-chip-row>
    }
    <input
      placeholder="New tag..."
      [matChipInputFor]="grid"
      [matChipInputSeparatorKeyCodes]="separators"
      matChipInputAddOnBlur
      (matChipInputTokenEnd)="add($event)" />
  </mat-chip-grid>
  <mat-hint>Press Enter or comma to add</mat-hint>
</mat-form-field>
