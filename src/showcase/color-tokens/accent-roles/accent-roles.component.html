<div class="cols">
  <section>
    <div class="swatch" style="background: var(--mat-sys-primary); color: var(--mat-sys-on-primary)">primary</div>
    <h3>The main action</h3>
    <p>Only for the thing you most want clicked.</p>
    <button matButton="filled">Save changes</button>
  </section>
  <section>
    <div class="swatch" style="background: var(--mat-sys-secondary-container); color: var(--mat-sys-on-secondary-container)">secondary</div>
    <h3>A quieter primary</h3>
    <p>Same hue, less colour. For selected states and supporting actions.</p>
    <button matButton="tonal">Add filter</button>
  </section>
  <section>
    <div class="swatch" style="background: var(--mat-sys-tertiary); color: var(--mat-sys-on-tertiary)">tertiary</div>
    <h3>A different hue</h3>
    <p>For the one thing that should stand apart and is not the main action.</p>
    <span class="badge">New</span>
  </section>
</div>
