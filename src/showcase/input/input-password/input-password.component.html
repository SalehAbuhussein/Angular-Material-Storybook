<mat-form-field appearance="outline" class="docs-field">
  <mat-label>Password</mat-label>
  <input matInput [type]="hidden() ? 'password' : 'text'" value="hunter2" />
  <button
    matIconButton
    matSuffix
    type="button"
    (click)="hidden.set(!hidden())"
    [attr.aria-label]="hidden() ? 'Show password' : 'Hide password'"
    [attr.aria-pressed]="!hidden()">
    <mat-icon>{{ hidden() ? 'visibility_off' : 'visibility' }}</mat-icon>
  </button>
</mat-form-field>
