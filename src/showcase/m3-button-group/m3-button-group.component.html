<div
  class="group"
  role="group"
  [attr.aria-label]="label()"
  [class]="'group group--' + variant() + ' group--' + size()"
>
  @for (item of items(); track item.id) {
    <button
      type="button"
      class="btn"
      matRipple
      [class.btn--on]="isOn(item.id)"
      [attr.aria-pressed]="isOn(item.id)"
      [attr.aria-label]="iconOnly() ? item.label : null"
      (click)="toggle(item.id)"
    >
      @if (item.icon) {
        <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
      }
      @if (!iconOnly()) {
        <span>{{ item.label }}</span>
      }
    </button>
  }
</div>
