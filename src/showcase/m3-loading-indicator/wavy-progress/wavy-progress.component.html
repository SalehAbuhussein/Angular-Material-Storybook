<svg
  [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
  [attr.height]="height()"
  role="progressbar"
  [attr.aria-label]="label()"
  [attr.aria-valuenow]="value()"
  aria-valuemin="0"
  aria-valuemax="100"
>
  <path class="track" [attr.d]="track()" [attr.stroke-width]="thickness()" />
  <path class="wave" [attr.d]="wave()" [attr.stroke-width]="thickness()" />
  @if (value() !== null && showStop()) {
    <circle class="stop" [attr.cx]="width() - thickness() / 2" [attr.cy]="centerY()" [attr.r]="thickness() / 2" />
  }
</svg>
