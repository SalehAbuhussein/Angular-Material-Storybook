<div class="docs-demo">
  <button
    matButton="filled"
    cdkOverlayOrigin
    #trigger="cdkOverlayOrigin"
    (click)="isOpen.set(!isOpen())">
    {{ isOpen() ? 'Close' : 'Open' }} menu
  </button>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="isOpen()"
    [cdkConnectedOverlayPositions]="positionList()"
    [cdkConnectedOverlayHasBackdrop]="hasBackdrop()"
    [cdkConnectedOverlayWidth]="width()"
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    (backdropClick)="isOpen.set(false)"
    (detach)="isOpen.set(false)">
    <div class="docs-overlay-panel">
      <mat-nav-list>
        <button mat-list-item (click)="isOpen.set(false)">Rename</button>
        <button mat-list-item (click)="isOpen.set(false)">Duplicate</button>
        <button mat-list-item (click)="isOpen.set(false)">Delete</button>
      </mat-nav-list>
    </div>
  </ng-template>
</div>
