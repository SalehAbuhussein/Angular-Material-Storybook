<mat-sidenav-container style="height: 400px">
  <mat-sidenav
    #drawer
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    style="width: 220px"
  >
    <mat-nav-list>
      <a mat-list-item href="#">Dashboard</a>
      <a mat-list-item href="#">Invoices</a>
      <a mat-list-item href="#">Customers</a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar style="background: var(--mat-sys-surface-container); color: var(--mat-sys-on-surface)">
      @if (isHandset()) {
        <button matIconButton aria-label="Toggle navigation" (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span style="margin-inline-start: 8px">Acme</span>
    </mat-toolbar>
    <div style="padding: 16px; font: var(--mat-sys-body-medium)">
      Viewport is {{ isHandset() ? 'handset' : 'wide' }}. Resize the preview to switch layouts.
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
