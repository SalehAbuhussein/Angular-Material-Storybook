<div class="docs-surface">
  <table mat-table [dataSource]="rows()" matSort (matSortChange)="onSort($event)">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Package</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>

    <ng-container matColumnDef="downloads">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Weekly downloads</th>
      <td mat-cell *matCellDef="let row">{{ row.downloads | number }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
  <p class="log">Last sort event: {{ lastSort() }}</p>
</div>
