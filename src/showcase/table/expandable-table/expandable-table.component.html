<div class="docs-surface">
  <table mat-table [dataSource]="data" multiTemplateDataRows>
    <ng-container matColumnDef="expand">
      <th mat-header-cell *matHeaderCellDef aria-label="Expand row"></th>
      <td mat-cell *matCellDef="let row">
        <button
          matIconButton
          [attr.aria-expanded]="expanded() === row"
          [attr.aria-label]="'Show notes for ' + row.version"
          (click)="toggle(row)"
        >
          <mat-icon>{{ expanded() === row ? 'expand_less' : 'expand_more' }}</mat-icon>
        </button>
      </td>
    </ng-container>

    <ng-container matColumnDef="version">
      <th mat-header-cell *matHeaderCellDef>Version</th>
      <td mat-cell *matCellDef="let row">{{ row.version }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>

    <ng-container matColumnDef="detail">
      <td mat-cell *matCellDef="let row" [attr.colspan]="columns.length">
        <div class="detail" [class.detail--open]="expanded() === row">
          <p>{{ row.notes }}</p>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
    <tr mat-row *matRowDef="let row; columns: ['detail']" class="detail-row"></tr>
  </table>
</div>
